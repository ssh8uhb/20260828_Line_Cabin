<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>建筑白模查看器</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f5f5f5;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
  #viewer{position:fixed;inset:0;}
  #ui{
    position:fixed;top:12px;left:12px;z-index:10;width:230px;
    max-height:calc(100vh - 24px);overflow-y:auto;
    background:rgba(255,255,255,.92);border:1px solid #ddd;border-radius:8px;
    padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.08);font-size:12px;color:#333;
  }
  #ui h1{font-size:14px;margin:0 0 4px;font-weight:600;}
  #ui .sub{color:#888;margin-bottom:8px;}
  #ui .row{display:flex;align-items:center;gap:6px;margin:3px 0;cursor:pointer;}
  #ui .row input{cursor:pointer;}
  #ui .sect{margin-top:8px;padding-top:8px;border-top:1px solid #eee;color:#888;}
  #ui .sbtn{
    padding:4px 0;font-size:12px;border:1px solid #ddd;border-radius:4px;
    background:#fff;color:#333;cursor:pointer;
  }
  #ui .sbtn:hover{background:#f0f0f0;}
  #ui .sbtn:disabled{color:#bbb;background:#fafafa;cursor:default;}
  #scene_fixed{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
  #btn_scene_save{display:block;width:100%;margin-top:4px;}
  .scn-row{display:flex;align-items:center;gap:4px;margin-top:4px;}
  .scn-row .scn-name{flex:1;text-align:left;padding-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .scn-row .scn-del{width:22px;color:#999;}
  .scn-row .scn-del:hover{color:#b23;border-color:#e0b4b4;background:#fdf3f3;}
  .scn-empty{color:#aaa;margin-top:4px;}
  #stats{margin-top:8px;padding-top:8px;border-top:1px solid #eee;color:#666;line-height:1.5;max-height:160px;overflow:auto;}
  #loadBtn,#envBtn{
    display:block;width:100%;margin:6px 0;padding:6px 0;border:1px dashed #aaa;border-radius:6px;
    background:#fafafa;color:#555;cursor:pointer;font-size:12px;
  }
  #loadBtn:hover,#envBtn:hover{background:#f0f0f0;}
  #fileInput,#envFileInput{display:none;}
  .sbtn-row{display:flex;gap:4px;}
  .sbtn-row .sbtn{flex:1;}
  #envStats{color:#888;margin-top:4px;line-height:1.4;font-size:11px;}
  #dropzone{
    position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(255,255,255,.92);
  }
  #dropzone .box{
    border:2px dashed #999;border-radius:12px;padding:48px 60px;text-align:center;color:#666;
    background:#fff;
  }
  #dropzone .box h2{margin:0 0 8px;font-weight:500;}
  #dropzone.active{display:flex;}
  #status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;color:#888;font-size:12px;background:rgba(255,255,255,.8);padding:4px 12px;border-radius:12px;}
  #err{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:14px;}
  #err .msg{background:#b23;padding:16px 24px;border-radius:8px;max-width:560px;}
  #legend{position:fixed;right:12px;bottom:12px;z-index:10;background:rgba(255,255,255,.85);border:1px solid #eee;border-radius:8px;padding:8px 10px;font-size:11px;color:#666;}
</style>
</head>
<body>
<div id="viewer"></div>

<div id="ui">
  <h1>建筑白模查看器</h1>
  <div class="sub">PlanFundingDrawing JSON → Three.js 白模</div>
  <button id="loadBtn">选择 / 拖入 JSON 文件</button>
  <input type="file" id="fileInput" accept=".json,application/json">
  <div class="sect">周边环境（总平面图）</div>
  <button id="envBtn" title="用地形高程点生成地形面、河床面与水面（默认载入 data/site-context.json 的内嵌副本）">载入周边环境（默认数据）</button>
  <input type="file" id="envFileInput" accept=".json,application/json">
  <div class="sbtn-row">
    <button id="envFileBtn" class="sbtn" type="button" title="选择其它 site-context JSON（同上格式）">选择文件…</button>
    <button id="envClearBtn" class="sbtn" type="button" title="移除地形 / 河床 / 水面">清除</button>
  </div>
  <div id="envStats">未载入</div>
  <div class="sect">场景（视角镜头）</div>
  <div id="scene_fixed"></div>
  <button id="btn_scene_save" class="sbtn" type="button" title="把当前镜头存为自定义场景（按图纸分别保存）">＋ 存为当前镜头</button>
  <div id="scene_custom"></div>
  <div class="sect">显示控制</div>
  <div style="display:flex;gap:6px;margin-bottom:6px;">
    <button id="btn_select_all" style="flex:1;padding:4px;font-size:12px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;">全选</button>
    <button id="btn_deselect_all" style="flex:1;padding:4px;font-size:12px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;">取消全选</button>
  </div>
  <label class="row">出图通道&nbsp;<select id="sel_channel" style="flex:1;padding:2px;font-size:12px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#333;">
    <option value="color">素模（彩色）</option>
    <option value="depth">深度 depth</option>
    <option value="normal">法线 normal</option>
  </select></label>
  <label class="row"><input type="checkbox" id="chk_lines" checked> 线稿叠加（黑线通道）</label>
  <label class="row"><input type="checkbox" id="chk_walls" checked> 墙体（含门窗洞口）</label>
  <label class="row"><input type="checkbox" id="chk_families" checked> 门窗构件（框/扇/玻璃）</label>
  <label class="row"><input type="checkbox" id="chk_slabs" checked> 楼板 / 平台</label>
  <label class="row"><input type="checkbox" id="chk_columns" checked> 结构柱</label>
  <label class="row"><input type="checkbox" id="chk_roof" checked> 屋面（檐口）</label>
  <label class="row"><input type="checkbox" id="chk_canopies" checked> 雨篷</label>
  <label class="row"><input type="checkbox" id="chk_stairs" checked> 楼梯 / 爬梯</label>
  <label class="row"><input type="checkbox" id="chk_extra" checked> 基础 / 集水坑 / 坡道</label>
  <label class="row"><input type="checkbox" id="chk_ground" checked> 地面 / 散水</label>
  <label class="row"><input type="checkbox" id="chk_terrain" checked> 周边地形面</label>
  <label class="row"><input type="checkbox" id="chk_riverbed" checked> 河道河床面</label>
  <label class="row"><input type="checkbox" id="chk_water" checked> 河道水面</label>
  <label class="row"><input type="checkbox" id="chk_envlines" checked> 环境线（岸线 / 轮廓）</label>
  <label class="row"><input type="checkbox" id="chk_annot" checked> 房间标注</label>
  <div id="stats">尚未加载数据</div>
</div>

<div id="dropzone">
  <div class="box">
    <h2>把 JSON 文件拖到这里</h2>
    <div>或点击左侧“选择 / 拖入 JSON 文件”</div>
  </div>
</div>

<div id="status">左键旋转 · 右键平移 · 滚轮缩放</div>
<div id="legend"></div>
<div id="err"><div class="msg" id="errMsg"></div></div>
